apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-booking
  labels:
    app: flight-booking
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flight-booking
  template:
    metadata:
      labels:
        app: flight-booking
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: flight-booking
          image: 257526643717.dkr.ecr.ap-south-1.amazonaws.com/flight-booking:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
