<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyline Air: book a flight</title>
<style>
:root {
  --ink: #10243e; --sky: #e6edf4; --card: #ffffff; --line: #c3d0de;
  --blue: #1f4fd8; --amber: #ffc845; --danger: #b3261e;
  --font: "Bahnschrift", "DIN Alternate", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--sky); color: var(--ink); font-family: var(--font); line-height: 1.5; }
.top { background: var(--ink); color: #fff; padding: 2.5rem 1.5rem 4.5rem; }
.top h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.4rem); letter-spacing: -0.02em; }
.top p { margin: .25rem 0 0; color: #b9c8dc; }
main { max-width: 820px; margin: -3rem auto 0; padding: 0 1rem 2rem; }
h2 { margin: 2rem 0 .75rem; font-size: 1.2rem; }

.search { display: grid; grid-template-columns: 1fr auto 1fr; gap: .75rem; align-items: end;
  background: var(--card); padding: 1.25rem; border-radius: 10px; border: 1px solid var(--line); }
.search label, dialog label { display: grid; gap: .25rem; font-size: .85rem; font-weight: 600; }
.search label:nth-of-type(3), .search .primary { grid-column: 1 / -1; }
select, input { font: inherit; padding: .6rem .7rem; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); }
button { font: inherit; padding: .6rem 1rem; border-radius: 6px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
button.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
button:hover { filter: brightness(.96); }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
@media (min-width: 720px) {
  .search { grid-template-columns: 1fr auto 1fr 1fr auto; }
  .search label:nth-of-type(3), .search .primary { grid-column: auto; }
}

.message { color: #4a5f78; margin: 1rem 0; }
.error { color: var(--danger); margin: 0; min-height: 1.2em; }

/* Boarding-pass style flight cards */
.pass { display: grid; grid-template-columns: 1fr auto; background: var(--card); border: 1px solid var(--line);
  border-radius: 10px; margin-bottom: .9rem; overflow: hidden; }
.pass .main { padding: 1rem 1.25rem; display: grid; grid-template-columns: auto 1fr auto; gap: 1rem; align-items: center; }
.code { font-size: 2rem; font-weight: 700; letter-spacing: .02em; line-height: 1; }
.time { font-size: .85rem; color: #4a5f78; }
.route-line { height: 2px; background: repeating-linear-gradient(90deg, var(--ink) 0 6px, transparent 6px 12px); position: relative; }
.route-line::after { content: "✈"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -52%); background: var(--card); padding: 0 .4rem; }
.stub { background: var(--amber); padding: 1rem 1.25rem; display: grid; gap: .5rem; align-content: center; justify-items: start;
  border-left: 2px dashed var(--ink); min-width: 150px; }
.price { font-size: 1.3rem; font-weight: 700; }
.seats { font-size: .8rem; }
.stub button { background: var(--ink); color: #fff; border-color: var(--ink); }
.stub button:disabled { opacity: .5; cursor: not-allowed; }
.pass.booked .stub { background: #dfe8f5; }
.pnr { font-size: 1.2rem; font-weight: 700; letter-spacing: .08em; }
@media (max-width: 560px) { .pass { grid-template-columns: 1fr; } .stub { border-left: 0; border-top: 2px dashed var(--ink); } }

dialog { border: 0; border-radius: 10px; padding: 1.5rem; width: min(420px, 92vw); color: var(--ink); }
dialog::backdrop { background: rgba(16, 36, 62, .55); }
dialog form { display: grid; gap: .9rem; }
dialog h3 { margin: 0; }
.total { font-weight: 700; margin: 0; }
.actions { display: flex; justify-content: flex-end; gap: .5rem; }
footer { text-align: center; font-size: .8rem; color: #4a5f78; padding: 1.5rem; }
</style>
</head>
<body>
<header class="top">
  <h1>Skyline Air</h1>
  <p> new Version  - CI/CD Pipeline</p>
</header>

<main>
  <form id="search" class="search" autocomplete="off">
    <label>From <select id="from" required></select></label>
    <button type="button" id="swap" aria-label="Swap airports">⇄</button>
    <label>To <select id="to" required></select></label>
    <label>Date <input type="date" id="date" required></label>
    <button type="submit" class="primary">Search flights</button>
  </form>

  <p id="message" class="message" role="status">Pick your route and date to see flights.</p>
  <section id="results" aria-live="polite"></section>

  <h2>Your bookings</h2>
  <section id="bookings"></section>
</main>

<dialog id="dialog">
  <form id="bookForm" method="dialog">
    <h3 id="dialogTitle"></h3>
    <label>Full name <input id="name" required maxlength="80"></label>
    <label>Email <input id="email" type="email" required></label>
    <label>Passengers <input id="pax" type="number" min="1" max="6" value="1" required></label>
    <p id="total" class="total"></p>
    <p id="formError" class="error" role="alert"></p>
    <div class="actions">
      <button type="button" id="cancelDialog">Close</button>
      <button type="submit" class="primary">Confirm booking</button>
    </div>
  </form>
</dialog>

<footer>Demo site. Bookings are saved in this browser only.</footer>

<script>
const AIRPORTS = { PNQ: 'Pune', BOM: 'Mumbai', DEL: 'Delhi', BLR: 'Bengaluru', HYD: 'Hyderabad', MAA: 'Chennai' };
const CAPACITY = 60;
const FLIGHTS = [
  { id: 'SK101', from: 'PNQ', to: 'DEL', dep: '06:10', arr: '08:25', price: 5400 },
  { id: 'SK102', from: 'DEL', to: 'PNQ', dep: '09:15', arr: '11:30', price: 5200 },
  { id: 'SK201', from: 'PNQ', to: 'BLR', dep: '07:30', arr: '09:00', price: 3900 },
  { id: 'SK202', from: 'BLR', to: 'PNQ', dep: '18:20', arr: '19:50', price: 4100 },
  { id: 'SK203', from: 'PNQ', to: 'BLR', dep: '16:45', arr: '18:15', price: 3600 },
  { id: 'SK301', from: 'BOM', to: 'DEL', dep: '08:00', arr: '10:10', price: 4800 },
  { id: 'SK302', from: 'DEL', to: 'BOM', dep: '12:40', arr: '14:50', price: 4700 },
  { id: 'SK401', from: 'HYD', to: 'MAA', dep: '10:05', arr: '11:20', price: 3100 },
  { id: 'SK402', from: 'MAA', to: 'HYD', dep: '14:30', arr: '15:45', price: 3200 },
  { id: 'SK501', from: 'BOM', to: 'BLR', dep: '06:50', arr: '08:35', price: 3700 },
  { id: 'SK502', from: 'BLR', to: 'BOM', dep: '19:10', arr: '20:55', price: 3800 },
  { id: 'SK601', from: 'PNQ', to: 'HYD', dep: '13:20', arr: '14:40', price: 3300 }
];

const $ = (id) => document.getElementById(id);
const money = (n) => '₹' + n.toLocaleString('en-IN');
const KEY = 'skyline-bookings';
let bookings = [], current = [], selected = null, lastSearch = null;

try { bookings = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(bookings)); } catch (e) {} };

const seatsLeft = (f, date) => CAPACITY - bookings
  .filter(b => b.flightId === f.id && b.date === date)
  .reduce((n, b) => n + b.passengers, 0);

function init() {
  const options = Object.entries(AIRPORTS).map(([c, n]) => `<option value="${c}">${n} (${c})</option>`).join('');
  $('from').innerHTML = options; $('to').innerHTML = options;
  $('from').value = 'PNQ'; $('to').value = 'DEL';
  const today = new Date().toISOString().slice(0, 10);
  $('date').min = today; $('date').value = today;
  renderBookings();
}

function passCard(f) {
  const full = f.seatsLeft === 0;
  return `<article class="pass">
    <div class="main">
      <div><div class="code">${f.from}</div><div class="time">${AIRPORTS[f.from]} · ${f.dep}</div></div>
      <div class="route-line" aria-hidden="true"></div>
      <div><div class="code">${f.to}</div><div class="time">${AIRPORTS[f.to]} · ${f.arr}</div></div>
    </div>
    <div class="stub">
      <div class="price">${money(f.price)}</div>
      <div class="seats">${f.id} · ${full ? 'Sold out' : f.seatsLeft + ' seats left'}</div>
      <button data-flight="${f.id}" ${full ? 'disabled' : ''}>Book seat</button>
    </div>
  </article>`;
}

function search() {
  const { from, to, date } = lastSearch;
  if (from === to) {
    $('results').innerHTML = '';
    $('message').textContent = 'Choose two different airports.';
    return;
  }
  current = FLIGHTS.filter(f => f.from === from && f.to === to)
    .map(f => ({ ...f, date, seatsLeft: seatsLeft(f, date) }));
  $('results').innerHTML = current.map(passCard).join('');
  $('message').textContent = current.length
    ? `${current.length} flight${current.length > 1 ? 's' : ''} from ${AIRPORTS[from]} to ${AIRPORTS[to]} on ${date}.`
    : 'No flights on this route. Try another pair of airports.';
}

$('search').addEventListener('submit', (e) => {
  e.preventDefault();
  lastSearch = { from: $('from').value, to: $('to').value, date: $('date').value };
  search();
});

$('swap').addEventListener('click', () => {
  const f = $('from').value; $('from').value = $('to').value; $('to').value = f;
});

$('results').addEventListener('click', (e) => {
  const id = e.target.dataset.flight;
  if (!id) return;
  selected = current.find(f => f.id === id);
  $('dialogTitle').textContent = `${selected.from} to ${selected.to}, ${selected.dep} on ${lastSearch.date}`;
  $('formError').textContent = '';
  updateTotal();
  $('dialog').showModal();
});

function updateTotal() { $('total').textContent = 'Total: ' + money((Number($('pax').value) || 0) * selected.price); }
$('pax').addEventListener('input', updateTotal);
$('cancelDialog').addEventListener('click', () => $('dialog').close());

$('bookForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const count = Number($('pax').value);
  if (!Number.isInteger(count) || count < 1 || count > 6) { $('formError').textContent = 'Book between 1 and 6 passengers.'; return; }
  if (count > seatsLeft(selected, lastSearch.date)) { $('formError').textContent = 'Not enough seats left on this flight.'; return; }
  const booking = {
    pnr: Math.random().toString(16).slice(2, 8).toUpperCase(),
    flightId: selected.id, date: lastSearch.date,
    from: selected.from, to: selected.to, dep: selected.dep, arr: selected.arr,
    name: $('name').value, email: $('email').value,
    passengers: count, total: count * selected.price
  };
  bookings.push(booking); save();
  $('dialog').close();
  $('message').textContent = `Booked. Your confirmation code is ${booking.pnr}.`;
  search(); renderBookings();
});

function renderBookings() {
  $('bookings').innerHTML = bookings.length ? bookings.map(b => `<article class="pass booked">
    <div class="main">
      <div><div class="code">${b.from}</div><div class="time">${b.dep}</div></div>
      <div class="route-line" aria-hidden="true"></div>
      <div><div class="code">${b.to}</div><div class="time">${b.arr}</div></div>
    </div>
    <div class="stub">
      <div class="pnr">${b.pnr}</div>
      <div class="seats">${b.date} · ${b.passengers} passenger${b.passengers > 1 ? 's' : ''} · ${money(b.total)}</div>
      <button data-cancel="${b.pnr}">Cancel booking</button>
    </div></article>`).join('')
    : '<p class="message">No bookings yet. Search for a flight to start.</p>';
}

$('bookings').addEventListener('click', (e) => {
  const pnr = e.target.dataset.cancel;
  if (!pnr) return;
  bookings = bookings.filter(b => b.pnr !== pnr); save();
  $('message').textContent = `Booking ${pnr} cancelled.`;
  renderBookings(); if (lastSearch) search();
});

init();
</script>
</body>
</html>
